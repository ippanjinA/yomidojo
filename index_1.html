<style>
/* Layout: a single column "practice sheet". Questions sit on kanji-practice grid cells (dashed cross guides), everything else stays quiet. */
:root{
  --bg:#edf0f4; --surface:#ffffff; --ink:#18212d; --muted:#5b6777; --line:#d3d9e1;
  --accent:#2c4a8e; --accent-ink:#ffffff; --accent-soft:#e1e8f6;
  --ok:#1b7548; --ok-bg:#e0f2e8; --ng:#b0321d; --ng-bg:#fbe6e1;
  --grid:#b9c3d1; --cell:#f8f9fb;
  --f-kanji:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#19212b; --ink:#e7ebf1; --muted:#9aa6b5; --line:#2b3542;
  --accent:#93acea; --accent-ink:#0e1522; --accent-soft:#222f4a;
  --ok:#74d7a4; --ok-bg:#16301f; --ng:#ff9d89; --ng-bg:#3b1e19;
  --grid:#3d4a5b; --cell:#141b24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#19212b; --ink:#e7ebf1; --muted:#9aa6b5; --line:#2b3542;
  --accent:#93acea; --accent-ink:#0e1522; --accent-soft:#222f4a;
  --ok:#74d7a4; --ok-bg:#16301f; --ng:#ff9d89; --ng-bg:#3b1e19;
  --grid:#3d4a5b; --cell:#141b24; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{margin:0;font-weight:700}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-kanji);font-size:34px;font-weight:700;letter-spacing:.06em;line-height:1.1}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.chip b{font-size:16px}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.levels{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lv{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 16px;font-weight:700;min-width:64px}
.lv{display:flex;flex-direction:column;align-items:center;line-height:1.25;min-width:68px;padding:6px 10px}
.lv small{font-weight:400;font-size:11px;opacity:.8}
.presets{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.lv[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;width:100%}
.mode:hover{border-color:var(--accent)}
.mode .glyph{grid-row:span 2;font-family:var(--f-kanji);font-size:30px;font-weight:700;color:var(--accent);width:44px;text-align:center}
.mode .t{font-weight:700;font-size:16px}
.mode .d{color:var(--muted);font-size:13px}
.mode .n{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);grid-row:span 2;text-align:right}
.mode .bar{grid-column:2/4;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.mode .bar i{display:block;height:100%;background:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;min-width:0}
.act:hover:not(:disabled){border-color:var(--accent)}
.act:disabled{opacity:.55;cursor:default}
.act .t{font-weight:700}
.act .d{color:var(--muted);font-size:13px}
.act.hot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.act.hot .d{color:inherit;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:12px}
.stats div{text-align:center}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.stats span{font-size:12px;color:var(--muted)}
.foot{color:var(--muted);font-size:12px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.link{background:none;border:0;padding:4px 0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meter.time i{transition:width .1s linear}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 16px;display:flex;flex-direction:column;gap:16px;align-items:center}
.tag{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:700;align-self:flex-start}
.cells{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:100%}
.cell{--cs:min(80px,calc((100vw - 90px)/var(--n)));width:var(--cs);height:var(--cs);display:grid;place-items:center;
  font-family:var(--f-kanji);font-size:calc(var(--cs)*.66);font-weight:500;background-color:var(--cell);border:1px solid var(--grid);
  background-image:repeating-linear-gradient(to bottom,var(--grid) 0 4px,transparent 4px 8px),repeating-linear-gradient(to right,var(--grid) 0 4px,transparent 4px 8px);
  background-size:1px 100%,100% 1px;background-position:center,center;background-repeat:no-repeat;line-height:1}
.cell span{background:var(--cell);padding:0 1px;border-radius:2px}
.prompt{margin:0;text-align:center;font-weight:500}
.prompt small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
form{display:flex;gap:8px;width:100%}
input[type=text],input[type=search]{flex:1;min-width:0;font:inherit;font-size:20px;padding:10px 14px;border-radius:8px;border:1px solid var(--grid);background:var(--cell);color:var(--ink)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 18px;font-weight:700;white-space:nowrap}
.primary:disabled{opacity:.5}
.fb{width:100%;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ng{background:var(--ng-bg);color:var(--ng)}
.fb .h{font-weight:700;font-size:17px}
.fb .a{font-family:var(--f-kanji);font-size:22px;font-weight:700;color:var(--ink)}
.fb .m{color:var(--ink);font-size:13.5px}
.next{align-self:stretch}
.score{font-variant-numeric:tabular-nums;font-weight:700}
.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.big{font-family:var(--f-kanji);font-size:56px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:baseline;padding:10px 4px;border-bottom:1px solid var(--line)}
.list .k{font-family:var(--f-kanji);font-size:24px;font-weight:700}
.list .r{min-width:0;overflow-wrap:anywhere}
.list .m{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px}
.tab[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tools label{display:flex;gap:6px;align-items:center;font-size:13px}
.book li{grid-template-columns:minmax(52px,auto) 1fr auto;cursor:pointer}
.book.hide .r .rd{visibility:hidden}
.book.hide li.open .r .rd{visibility:visible}
.st{font-size:11.5px;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.st.mastered{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.st.review{color:var(--ng);background:var(--ng-bg);border-color:transparent}
.st.learning{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.empty{color:var(--muted);text-align:center;padding:24px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){.two{grid-template-columns:1fr}}
</style>
</head>

  var h='<div class="top"><div><h1 class="brand">読み道場</h1><div class="sub">漢検の級で選ぶ、漢字の「読み」特訓</div></div>'+
    '<div class="chip">連続 <b>'+streak()+'</b> 日</div></div>';
  h+='<div><div class="label" style="margin-bottom:8px">出題する級(漢検)</div><div class="levels">'+GORDER.map(function(l){
      var n=ITEMS.filter(function(it){return it.g===l}).length;
      return'<button class="lv" data-act="lv" data-v="'+l+'" aria-pressed="'+(P.gr.indexOf(l)>-1)+'"><span>'+GL[l]+'</span><small>'+n+'問</small></button>'}).join("")+'</div>'+
    '<div class="presets"><button class="link" data-act="preset" data-v="e">小学校(10〜5級)</button><button class="link" data-act="preset" data-v="m">中学(4・3級)</button><button class="link" data-act="preset" data-v="h">高校〜(準2・2級)</button><button class="link" data-act="preset" data-v="t">最上級(準1・1級)</button></div></div>';
  h+='<div class="modes">'+["j","k","w"].map(function(m){
    var pl=pool(m),ms=pl.filter(function(it){return status(it.id)==="mastered"}).length,pc=pl.length?Math.round(ms/pl.length*100):0;
    return'<button class="mode" data-act="start" data-v="'+m+'"><span class="glyph">'+MODES[m].glyph+'</span><span class="t">'+MODES[m].name+
      '</span><span class="n">習得 '+ms+' / '+pl.length+'</span><span class="d">'+MODES[m].desc+'</span><span class="bar"><i style="width:'+pc+'%"></i></span></button>'}).join("")+'</div>';
  h+='<div class="two"><button class="act'+(rv?" hot":"")+'" data-act="start" data-v="review"'+(rv?"":" disabled")+'><div class="t">間違えた問題の復習</div><div class="d">'+(rv?rv+" 問が復習待ち":"復習する問題はありません")+'</div></button>'+
    '<button class="act" data-act="start" data-v="challenge"><div class="t">60秒チャレンジ</div><div class="d">ベスト '+(P.best?P.best+" 問":"記録なし")+'</div></button></div>';
  h+='<button class="act" data-act="book"><div class="t">単語帳</div><div class="d">熟語・語・漢字の読みを一覧で確認する</div></button>';
  h+='<div class="stats"><div><b>'+mastered+'</b><span>習得(選択レベル)</span></div><div><b>'+acc+'</b><span>通算の正答率</span></div><div><b>'+(tok+tng)+'</b><span>解いた回数</span></div></div>';
  h+='<div class="foot"><span>級は漢検の配当漢字表をもとに、語を構成する漢字のうち最も上の級で分けています。3回連続で正解すると「習得」になります。進捗はこのブラウザに保存されます。</span><button class="link" data-act="reset">'+(resetArm?"本当に消す(もう一度押す)":"進捗をリセット")+'</button></div>';
  app.innerHTML=h}

function startSession(m){
  stop();
  if(m==="challenge"){
    var pl=pool("mix");S={mode:m,ch:true,pool:pl,score:0,miss:0,wrong:[],cur:null,last:null,answered:false,endAt:Date.now()+60000};
    S.cur=pick();view="quiz";render();
    timer=setInterval(tick,100);return}
  var p=pool(m);if(!p.length)return;
  var q=sample(p,Math.min(10,p.length));
  S={mode:m,ch:false,queue:q,i:0,score:0,wrong:[],cur:q[0],answered:false};view="quiz";render()}
function pick(){
  var p=S.pool,it,n=0;do{it=p[Math.floor(Math.random()*p.length)];n++}while(S.last&&it.id===S.last&&p.length>1&&n<20);
  S.last=it.id;return it}
function tick(){
  var left=S.endAt-Date.now();
  if(left<=0){finish();return}
  var b=$("tbar"),t=$("tleft");if(b)b.style.width=(left/600)+"%";if(t)t.textContent=Math.ceil(left/1000)+"秒"}

function cellsHtml(txt){var a=Array.from(txt);return'<div class="cells" style="--n:'+Math.max(a.length,2)+'" aria-label="'+esc(txt)+'">'+a.map(function(c){return'<div class="cell"><span>'+esc(c)+'</span></div>'}).join("")+'</div>'}
function promptHtml(it){
  if(it.mode==="k")return'<p class="prompt">「'+esc(it.text)+'」の<b>'+(it.kind==="on"?"音読み":"訓読み")+'</b>を答えてください<small>'+
    (it.kind==="on"?"カタカナの読みでも、ひらがなで入力してOK。どれか1つでも正解":"送りがなは省略してもOK。どれか1つでも正解")+'</small></p>';
  if(it.mode==="w")return'<p class="prompt">読みを<b>ひらがな</b>で入力<small>送りがなも含めて答えてください</small></p>';
  return'<p class="prompt">読みを<b>ひらがな</b>で入力<small>'+(it.show.length>1?"読みが複数ある語です。どれか1つでOK":"熟語の読みを答えてください")+'</small></p>'}

function quiz(){
  var it=S.cur,h='<div class="bar-top"><button class="ghost" data-act="home">← ホーム</button>';
  if(S.ch)h+='<div class="score">正解 '+S.score+' 問 · <span id="tleft">60秒</span></div></div><div class="meter time"><i id="tbar" style="width:100%"></i></div>';
  else h+='<div class="score">'+(S.i+1)+' / '+S.queue.length+'</div></div><div class="meter"><i style="width:'+(S.i/S.queue.length*100)+'%"></i></div>';
  h+='<section class="qcard"><div class="tag">'+(S.ch?"チャレンジ":(S.mode==="review"?"復習":MODES[it.mode].name))+' · '+tagOf(it)+'</div>'+cellsHtml(it.text)+promptHtml(it)+
    '<form id="f" autocomplete="off"><input id="ans" type="text" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="こたえ" aria-label="読みを入力"><button class="primary" type="submit" id="go">こたえる</button></form>'+
    '<button class="link" data-act="skip" id="skip">'+(S.ch?"パス":"わからない")+'</button><div id="fb" aria-live="polite" style="width:100%"></div></section>';
  app.innerHTML=h;
  var f=$("f"),inp=$("ans");
  inp.addEventListener("compositionstart",function(){composing=true});
  inp.addEventListener("compositionend",function(){composing=false;lastComp=Date.now()});
  f.addEventListener("submit",function(e){e.preventDefault();if(composing||Date.now()-lastComp<60||S.answered)return;answer(inp.value)});
  inp.focus()}

function readingHtml(it){
  if(it.mode==="k")return'<div class="a">音 '+it.on.join("・")+'　訓 '+it.kun.join("・")+'</div>';
  return'<div class="a">'+it.show.join("・")+'</div>'}
function answer(val){
  var it=S.cur;if(S.answered)return;
  var ok=val!==null&&it.answers.indexOf(norm(val))>-1;
  if(val!==null&&!norm(val)){return}
  S.answered=true;S.answeredAt=Date.now();record(it,ok);
  if(ok)S.score++;else{S.wrong.push(it);S.miss=(S.miss||0)+1}
  var fb=$("fb");
  fb.innerHTML='<div class="fb '+(ok?"ok":"ng")+'"><div class="h">'+(ok?"正解":(val===null?"答えを確認":"ちがいます"+(val.trim()?"(あなたの答え: "+esc(val.trim())+")":"")))+'</div>'+
    readingHtml(it)+'<div class="m">'+(it.mode==="k"?esc(it.text)+" · ":"")+esc(it.meaning)+'</div></div>'+
    (S.ch?"":'<button class="primary next" data-act="next" style="margin-top:10px;width:100%">'+(S.i+1>=S.queue.length?"結果を見る":"つぎへ")+'(Enter)</button>');
  $("ans").disabled=true;$("go").disabled=true;$("skip").hidden=true;
  if(S.ch){clearTimeout(tout);tout=setTimeout(next,ok?450:1700)}}
function next(){
  if(!S||view!=="quiz"||!S.answered)return;
  clearTimeout(tout);
  if(S.ch){S.cur=pick();S.answered=false;var left=S.endAt-Date.now();if(left<=0){finish();return}quiz();tick();return}
  S.i++;if(S.i>=S.queue.length){finish();return}
  S.cur=S.queue[S.i];S.answered=false;quiz()}
function finish(){
  stop();if(!S)return;
  if(S.ch&&S.score>P.best){S.newBest=true;P.best=S.score;save()}
  view="result";render()}

function result(){
  var n=S.ch?S.score+(S.miss||0):S.queue.length,acc=n?Math.round(S.score/n*100):0;
  var h='<div class="result"><div class="label">'+(S.ch?"60秒チャレンジ":MODES[S.mode]?MODES[S.mode].name:"復習")+' 終了</div>'+
    '<div class="big">'+S.score+(S.ch?'<span style="font-size:24px"> 問正解</span>':' / '+n)+'</div>'+
    '<div>正答率 '+acc+'%'+(S.ch&&S.newBest?' · <b style="color:var(--ok)">ベスト更新</b>':(S.ch?' · ベスト '+P.best+' 問':''))+'</div></div>';
  if(S.wrong.length){h+='<div class="label">間違えた問題(復習リストに追加されます)</div><ul class="list">'+S.wrong.map(function(it){
    return'<li><span class="k">'+esc(it.text)+'</span><span class="r">'+(it.mode==="k"?(it.kind==="on"?"音 ":"訓 ")+it.show.join("・"):it.show.join("・"))+'<div class="m">'+esc(it.meaning)+'</div></span></li>'}).join("")+'</ul>'}
  else h+='<div class="empty">'+(S.score>0?'全問正解です。':'回答がありませんでした。')+'</div>';
  h+='<div class="two"><button class="act hot" data-act="again"><div class="t">もう一度</div></button><button class="act" data-act="home"><div class="t">ホームへ</div></button></div>';
  app.innerHTML=h}

function rowStatus(ids){
  var s=ids.map(status);
  if(s.indexOf("review")>-1)return"review";
  if(s.every(function(x){return x==="mastered"}))return"mastered";
  if(s.every(function(x){return x==="new"}))return"new";
  return"learning"}
function bookView(){
  var rows=[];
  if(book.tab==="k"){KANJI.forEach(function(k){if(!inLv(k))return;
    rows.push({k:k.c,r:"音 "+k.on.join("・")+"　訓 "+k.kun.join("・"),m:k.meaning,st:rowStatus(k.ids)})})}
  else ITEMS.forEach(function(it){if(it.mode!==book.tab||!inLv(it))return;rows.push({k:it.text,r:it.show.join("・"),m:it.meaning,st:status(it.id)})});
  var q=book.q.trim().toLowerCase();
  if(q){var qn=norm(q);rows=rows.filter(function(r){return r.k.indexOf(q)>-1||norm(r.r).indexOf(qn)>-1||r.m.toLowerCase().indexOf(q)>-1})}
  var h='<div class="bar-top"><button class="ghost" data-act="home">← ホーム</button><div class="score">単語帳 · '+rows.length+' 件</div></div>';
  h+='<div class="tabs">'+["j","w","k"].map(function(m){return'<button class="tab" data-act="tab" data-v="'+m+'" aria-pressed="'+(book.tab===m)+'">'+MODES[m].name+'</button>'}).join("")+'</div>';
  h+='<div class="tools"><input id="q" type="search" placeholder="漢字・読み・英語で検索" value="'+esc(book.q)+'" style="font-size:15px;padding:8px 12px"><label><input type="checkbox" id="hide"'+(P.hide?" checked":"")+'> 読みを隠す</label></div>';
  h+='<div class="label">出題範囲: '+selLabel()+'(ホームで変更)'+(P.hide?'　行をタップすると読みが見えます':'')+'</div>';
  h+=rows.length?'<ul class="list book'+(P.hide?" hide":"")+'" id="bl">'+rows.map(function(r){
    return'<li data-act="open"><span class="k">'+esc(r.k)+'</span><span class="r"><span class="rd">'+esc(r.r)+'</span><div class="m">'+esc(r.m)+'</div></span><span class="st '+r.st+'">'+STL[r.st]+'</span></li>'}).join("")+'</ul>':'<div class="empty">該当する項目がありません。</div>';
  app.innerHTML=h;
  var qi=$("q");qi.addEventListener("input",function(){book.q=qi.value;var pos=qi.selectionStart;bookView();var n=$("q");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}});
  $("hide").addEventListener("change",function(e){P.hide=e.target.checked;save();bookView()})}

/* ---------- events ---------- */
app.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t||t.disabled)return;
  var a=t.getAttribute("data-act"),v=t.getAttribute("data-v");
  if(a==="lv"){var l=+v,arr=P.gr,i=arr.indexOf(l);if(i>-1){if(arr.length>1)arr.splice(i,1)}else arr.push(l);save();home()}
  else if(a==="preset"){P.gr=GSET[v].slice();save();home()}
  else if(a==="start"){resetArm=false;startSession(v)}
  else if(a==="home"){resetArm=false;go("home")}
  else if(a==="book"){go("book")}
  else if(a==="tab"){book.tab=v;bookView()}
  else if(a==="open"){t.classList.toggle("open")}
  else if(a==="skip"){answer(null)}
  else if(a==="next"){next()}
  else if(a==="again"){startSession(S.ch?"challenge":S.mode)}
  else if(a==="reset"){if(resetArm){P.stats={};P.days=[];P.best=0;save();resetArm=false}else resetArm=true;home()}});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&view==="quiz"&&S&&S.answered&&!S.ch&&!e.isComposing&&Date.now()-S.answeredAt>250){e.preventDefault();next()}});
render();
})();
</script>

</body>
